type: llm
provider: litellm_llm
models:
  - alias: default
    model: vertex_ai/gemini-2.5-pro-preview-05-06
    context_window_size: 128000 # Assuming a large context window for Gemini 2.5 Pro
    timeout: 120 # Added timeout, was in google_ai_studio example
    kwargs:
      max_tokens: 8192
      temperature: 0.2
      project_id: james-sandbox-317709
      location: us-central1
      # n: 1 # from google_ai_studio example, usually default
      # seed: 0 # from config.example.yaml, for reproducibility
  - alias: gemini-llm-for-chart
    model: vertex_ai/gemini-2.5-pro-preview-05-06
    context_window_size: 128000 # Assuming a large context window
    timeout: 120 # Added timeout
    kwargs:
      max_tokens: 8192
      temperature: 0.2
      project_id: james-sandbox-317709
      location: us-central1
      response_format:
        type: json_object
      # n: 1 # from google_ai_studio example

---
type: embedder
provider: litellm_embedder
models:
  - model: vertex_ai/textembedding-gecko@003
    alias: default
    timeout: 120
    # LiteLLM might infer project_id and location from environment variables
    # or needs them explicitly. Adding them here for clarity as requested.
    project_id: james-sandbox-317709
    location: us-central1

---
type: engine
provider: wren_ui
endpoint: http://wren-ui:3000

---
type: engine
provider: wren_ibis
# ibis-server was removed from docker-compose.gcp.yaml.
# If this causes issues because a pipe needs it, this entry or the pipe might need removal.
endpoint: http://ibis-server:8000

---
type: document_store
provider: qdrant
location: http://qdrant:6333
embedding_model_dim: 768 # Dimension for textembedding-gecko@003
timeout: 120
recreate_index: true

---
type: pipeline
# Pipes are based on docker/config.example.yaml, with LLM/embedder aliases updated.
pipes:
  - name: db_schema_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: historical_question_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: table_description_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: db_schema_retrieval
    llm: litellm_llm.default
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: historical_question_retrieval
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: sql_generation
    llm: litellm_llm.default
    engine: wren_ui
  - name: sql_correction
    llm: litellm_llm.default
    engine: wren_ui
  - name: followup_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
  - name: sql_answer
    llm: litellm_llm.default
  - name: semantics_description
    llm: litellm_llm.default
  - name: relationship_recommendation
    llm: litellm_llm.default
    engine: wren_ui
  - name: question_recommendation
    llm: litellm_llm.default
  - name: question_recommendation_db_schema_retrieval
    llm: litellm_llm.default
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: question_recommendation_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
  - name: intent_classification
    llm: litellm_llm.default
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: misleading_assistance
    llm: litellm_llm.default
  - name: data_assistance
    llm: litellm_llm.default
  - name: sql_pairs_indexing
    document_store: qdrant
    embedder: litellm_embedder.default
  - name: sql_pairs_retrieval
    document_store: qdrant
    embedder: litellm_embedder.default
    llm: litellm_llm.default
  - name: preprocess_sql_data
    llm: litellm_llm.default
  - name: sql_executor
    engine: wren_ui
  - name: chart_generation
    llm: litellm_llm.gemini-llm-for-chart # Using the specialized model
  - name: chart_adjustment
    llm: litellm_llm.gemini-llm-for-chart # Using the specialized model
  - name: user_guide_assistance
    llm: litellm_llm.default
  - name: sql_question_generation
    llm: litellm_llm.default
  - name: sql_generation_reasoning
    llm: litellm_llm.default
  - name: followup_sql_generation_reasoning
    llm: litellm_llm.default
  - name: sql_regeneration
    llm: litellm_llm.default
    engine: wren_ui
  - name: instructions_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: instructions_retrieval
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: sql_functions_retrieval
    # This pipe uses wren_ibis. If ibis-server is indeed not running,
    # this pipe or the sql_functions_retrieval feature might fail.
    engine: wren_ibis
    document_store: qdrant
  - name: project_meta_indexing
    document_store: qdrant
  - name: sql_tables_extraction
    llm: litellm_llm.default

---
settings:
  doc_endpoint: https://docs.getwren.ai
  is_oss: true
  engine_timeout: 30
  column_indexing_batch_size: 50
  table_retrieval_size: 10
  table_column_retrieval_size: 100
  allow_intent_classification: true
  allow_sql_generation_reasoning: true
  allow_sql_functions_retrieval: true # Corresponds to sql_functions_retrieval pipe
  enable_column_pruning: false
  max_sql_correction_retries: 3
  query_cache_maxsize: 1000
  query_cache_ttl: 3600
  langfuse_host: https://cloud.langfuse.com
  langfuse_enable: true # Kept from example, can be false if not needed
  logging_level: DEBUG # As requested
  development: false # As requested
  historical_question_retrieval_similarity_threshold: 0.9
  sql_pairs_similarity_threshold: 0.7
  sql_pairs_retrieval_max_size: 10
  instructions_similarity_threshold: 0.7
  instructions_top_k: 10
